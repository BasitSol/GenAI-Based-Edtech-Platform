extends: baseline.yaml
embedding_provider: openai
embedding_model: text-embedding-3-small
contextual_enrichment: deterministic_metadata_v2
reranker_model: BAAI/bge-reranker-base
reranker_candidates: 24
reranker_max_length: 512
parent_child_expansion: true
extractive_context_compression: true
adaptive_multi_query: true
maximum_retrieval_retries: 1
workflow: langgraph_bounded
