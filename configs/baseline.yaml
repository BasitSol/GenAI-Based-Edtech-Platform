parser: pymupdf
secondary_parser: pdfplumber
ocr_engine: paddleocr
ocr_fallback: tesseract
ocr_mode: selective
textbook_child_tokens: 450
textbook_parent_tokens: 1500
textbook_overlap_tokens: 60
syllabus_chunking: learning_objective
question_chunking: subquestion
mark_scheme_chunking: question_number
examiner_report_chunking: question_number
embedding_provider: sentence_transformers
embedding_model: BAAI/bge-m3
embedding_max_length: 8192
contextual_enrichment: metadata-v2
vector_database: chromadb
keyword_search: bm25
metadata_database: sqlite
dense_top_k: 15
bm25_top_k: 15
fusion_top_k: 12
reranked_top_k: 6
maximum_context_chunks: 8
maximum_retrieval_retries: 1
reranker_model: BAAI/bge-reranker-base
reranker_candidates: 24
reranker_max_length: 512
extractive_context_compression: true
backend: fastapi
frontend: streamlit
workflow: deterministic_first
